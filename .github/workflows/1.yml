name: Build static bpftrace (ARM64 only)

on:
  workflow_dispatch:

jobs:
  build_bpftrace_static:
    name: Build static bpftrace binaries
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        env:
          - ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo ./scripts/jammy-install-deps.sh
      - name: Setup NDK
        run: ./scripts/download-ndk.sh
      - name: Build
        run: make bpftrace NDK_PATH=`pwd`/android-ndk-r27b NDK_ARCH=${{ matrix.env['ARCH'] }} STATIC_LINKING=true LLVM_BPF_ONLY=true THREADS=1
      - uses: actions/upload-artifact@v4
        with:
          name: bpftrace-android-${{ matrix.env['ARCH'] }}
          path: out/android/${{ matrix.env['ARCH'] }}/bin/bpftrace